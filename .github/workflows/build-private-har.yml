name: ohos

on:
  repository_dispatch:
    types: [rustdesk-har-published]
  workflow_dispatch:
    inputs:
      package_name:
        description: Core HAR package published by RustDeskHar
        required: true
        default: rustdesk-ohrs
        type: string

permissions:
  contents: read

env:
  OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280
  CORE_HAR_PACKAGE: ${{ github.event.client_payload.package_name || inputs.package_name || 'rustdesk-ohrs' }}
  CORE_HAR_REGISTRY: https://devrepo.devcloud.cn-north-4.huaweicloud.com/artgalaxy/api/ohpm/cn-north-4_c07b1b38744f424b8d87a86532d38003_ohpm_1/
  SIGNING_REPOSITORY: ${{ vars.SIGNING_REPOSITORY || 'FrankHan052176/AppGallerySigning' }}
  SIGNING_REPOSITORY_REF: ${{ vars.SIGNING_REPOSITORY_REF || '70779bd9e42c8565772dd8c43c80b89a197c3369' }}
  AGC_ENABLED: ${{ secrets.AGC_CLIENT_ID != '' && secrets.AGC_CLIENT_SECRET != '' && secrets.AGC_APP_ID != '' }}
  AGC_API_DOMAIN: ${{ vars.AGC_API_DOMAIN || 'connect-api.cloud.huawei.com' }}
  AGC_TEST_TYPE: ${{ vars.AGC_TEST_TYPE || '3' }}
  AGC_TEST_DESC: ${{ vars.AGC_TEST_DESC || '' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    environment: harmonyos-ci-signing
    steps:
      - name: Setup
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup HarmonyOS
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: ohpm
        id: ohpm
        shell: bash
        env:
          CODEARTS_PRIVATE_OHPM_READ: ${{ secrets.CODEARTS_PRIVATE_OHPM_READ }}
        run: |
          private_config="$HOME/.ohpm/.ohpmrc"
          mkdir -p "$HOME/.ohpm"
          printf '%s' "$CODEARTS_PRIVATE_OHPM_READ" > "$private_config"

          ohpm uninstall rustdesk-ohrs
          echo "Installing Core HAR: $CORE_HAR_PACKAGE"
          ohpm install "${CORE_HAR_PACKAGE}@latest" \
            --registry "$CORE_HAR_REGISTRY" \
            --retry_times 5 \
            --retry_interval 3000
          (
            cd entry
            ohpm uninstall luminous_neo
            ohpm install luminous_neo@latest \
              --registry "$CORE_HAR_REGISTRY" \
              --retry_times 5 \
              --retry_interval 3000
          )

          rm -f "$private_config"
          ohpm install
          (
            cd entry
            ohpm install
          )

          core_har_version="$(jq -er '.version' "oh_modules/${CORE_HAR_PACKAGE}/oh-package.json5")"
          echo "Core HAR version: $core_har_version"
          echo "core_har_version=$core_har_version" >> "$GITHUB_OUTPUT"

      - name: Sign
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SIGNING_REPOSITORY }}
          ref: ${{ env.SIGNING_REPOSITORY_REF }}
          token: ${{ secrets.SIGNING_REPOSITORY_TOKEN }}
          path: .ci-signing-repo
          persist-credentials: false

      - name: Sign config
        shell: bash
        env:
          SIGNING_REPOSITORY_DIR: ${{ github.workspace }}/.ci-signing-repo
          SIGNING_APP_DIR: RustDesk
          SIGNING_OUTPUT_DIR: ${{ runner.temp }}/rustdesk-signing
        run: |
          set -euo pipefail
          .github/scripts/prepare-signing-config.sh
          echo "RUSTDESK_SIGNING_DIR=$SIGNING_OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          hvigorw clean --no-daemon
          hvigorw assembleApp \
            -p product=publish \
            -p buildMode=release \
            --no-daemon \
            --no-incremental

      - name: Upload prep
        id: app
        shell: bash
        env:
          CORE_HAR_VERSION: ${{ steps.ohpm.outputs.core_har_version }}
        run: |
          set -euo pipefail

          signed_app="$(find build -type f -name '*-signed.app' -print -quit 2>/dev/null || true)"
          if [[ -z "$signed_app" ]]; then
            echo "Signed App was not produced." >&2
            exit 1
          fi

          mkdir -p ci-output
          output_app="ci-output/RustDesk-${CORE_HAR_VERSION}.app"
          cp "$signed_app" "$output_app"
          echo "path=$output_app" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RustDesk-${{ steps.ohpm.outputs.core_har_version }}.app
          path: ${{ steps.app.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload and submit AGC test version
        if: ${{ env.AGC_ENABLED == 'true' }}
        id: agc
        env:
          AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
          AGC_API_DOMAIN: ${{ env.AGC_API_DOMAIN }}
          AGC_TEST_TYPE: ${{ env.AGC_TEST_TYPE }}
          AGC_TEST_DESC: ${{ env.AGC_TEST_DESC }}
          AGC_APP_FILE: ${{ steps.app.outputs.path }}
        run: .github/scripts/agc-test-release.sh "$AGC_APP_FILE"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ohpm/.ohpmrc"
          rm -rf "$RUNNER_TEMP/rustdesk-signing"
          rm -rf "$GITHUB_WORKSPACE/.ci-signing-repo"
