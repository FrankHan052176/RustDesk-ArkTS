name: Build ArkTS HarmonyOS App

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [rustdesk-har-published]
  workflow_dispatch:
    inputs:
      package_name:
        description: Core HAR package published by RustDeskHar
        required: true
        default: rustdesk-ohrs
        type: string
      package_version:
        description: Exact immutable Core HAR version to release
        required: true
        type: string
      core_sha:
        description: Full Core commit SHA used to build the HAR
        required: true
        type: string
      har_sha:
        description: Full HAR adapter commit SHA used to publish the package
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'push-validation' || format('{0}-{1}', github.event_name, github.event.client_payload.package_version || inputs.package_version || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280
  CORE_HAR_PACKAGE: ${{ github.event.client_payload.package_name || inputs.package_name || 'rustdesk-ohrs' }}
  CORE_HAR_VERSION: ${{ github.event.client_payload.package_version || inputs.package_version || '' }}
  CORE_SHA: ${{ github.event.client_payload.core_sha || inputs.core_sha || '' }}
  HAR_SHA: ${{ github.event.client_payload.har_sha || inputs.har_sha || '' }}
  CORE_HAR_REGISTRY: https://devrepo.devcloud.cn-north-4.huaweicloud.com/artgalaxy/api/ohpm/cn-north-4_c07b1b38744f424b8d87a86532d38003_ohpm_1/
  LUMINOUS_NEO_VERSION: 1.0.2
  SIGNING_REPOSITORY: ${{ vars.SIGNING_REPOSITORY || 'FrankHan052176/AppGallerySigning' }}
  SIGNING_REPOSITORY_REF: ${{ vars.SIGNING_REPOSITORY_REF || '70779bd9e42c8565772dd8c43c80b89a197c3369' }}
  AGC_ENABLED: ${{ (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && secrets.AGC_CLIENT_ID != '' && secrets.AGC_CLIENT_SECRET != '' && secrets.AGC_APP_ID != '' }}
  AGC_API_DOMAIN: ${{ vars.AGC_API_DOMAIN || 'connect-api.cloud.huawei.com' }}
  AGC_TEST_DURATION_DAYS: ${{ vars.AGC_TEST_DURATION_DAYS || '14' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    environment: harmonyos-ci-signing
    steps:
      - name: Setup
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup HarmonyOS
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: ohpm
        id: ohpm
        shell: bash
        env:
          CODEARTS_PRIVATE_OHPM_READ: ${{ secrets.CODEARTS_PRIVATE_OHPM_READ }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            if [[ -z "$CORE_HAR_VERSION" ]]; then
              echo "Release delivery requires an exact Core HAR version." >&2
              exit 1
            fi
            if [[ ! "$CORE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Release delivery requires a full 40-character Core SHA." >&2
              exit 1
            fi
            if [[ ! "$HAR_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Release delivery requires a full 40-character HAR SHA." >&2
              exit 1
            fi
          fi

          private_config="$HOME/.ohpm/.ohpmrc"
          umask 077
          mkdir -p "$HOME/.ohpm"
          printf '%s' "$CODEARTS_PRIVATE_OHPM_READ" > "$private_config"
          chmod 0600 "$private_config"

          core_har_spec="${CORE_HAR_PACKAGE}@latest"
          if [[ -n "$CORE_HAR_VERSION" ]]; then
            core_har_spec="${CORE_HAR_PACKAGE}@${CORE_HAR_VERSION}"
          fi
          ohpm uninstall "$CORE_HAR_PACKAGE" >/dev/null 2>&1 || true
          rm -rf "oh_modules/${CORE_HAR_PACKAGE}"
          echo "Installing Core HAR: $core_har_spec"
          ohpm install "$core_har_spec" \
            --registry "$CORE_HAR_REGISTRY" \
            --retry_times 5 \
            --retry_interval 3000
          (
            cd entry
            echo "Installing Luminous Neo: luminous_neo@$LUMINOUS_NEO_VERSION"
            ohpm install "luminous_neo@$LUMINOUS_NEO_VERSION" \
              --registry "$CORE_HAR_REGISTRY" \
              --retry_times 5 \
              --retry_interval 3000
          )

          ohpm install
          (
            cd entry
            ohpm install
          )
          rm -f "$private_config"

          core_har_version="$(jq -er '.version' "oh_modules/${CORE_HAR_PACKAGE}/oh-package.json5")"
          core_har_integrity="$(jq -er --arg package_name "$CORE_HAR_PACKAGE" \
            '[.packages | to_entries[] | select(.value.name == $package_name) | .value.integrity // empty][0]' \
            oh-package-lock.json5)"
          core_har_provenance="oh_modules/${CORE_HAR_PACKAGE}/release-provenance.json"
          luminous_neo_version="$(jq -er '.version' "entry/oh_modules/luminous_neo/oh-package.json5")"
          if [[ -n "$CORE_HAR_VERSION" && "$core_har_version" != "$CORE_HAR_VERSION" ]]; then
            echo "Expected ${CORE_HAR_PACKAGE}@${CORE_HAR_VERSION}, got ${core_har_version}" >&2
            exit 1
          fi
          if [[ "$luminous_neo_version" != "$LUMINOUS_NEO_VERSION" ]]; then
            echo "Expected luminous_neo@$LUMINOUS_NEO_VERSION, got $luminous_neo_version" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            jq -e \
              --arg core_sha "${CORE_SHA,,}" \
              --arg har_sha "${HAR_SHA,,}" \
              --arg package_name "$CORE_HAR_PACKAGE" \
              --arg package_version "$CORE_HAR_VERSION" \
              '.core_sha == $core_sha
                and .har_sha == $har_sha
                and .package_name == $package_name
                and .package_version == $package_version' \
              "$core_har_provenance" >/dev/null
          fi
          echo "Core HAR version: $core_har_version"
          echo "Core HAR integrity: $core_har_integrity"
          echo "Luminous Neo version: $luminous_neo_version"
          echo "core_har_version=$core_har_version" >> "$GITHUB_OUTPUT"
          echo "core_har_integrity=$core_har_integrity" >> "$GITHUB_OUTPUT"

      - name: Sign
        id: signing
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SIGNING_REPOSITORY }}
          ref: ${{ env.SIGNING_REPOSITORY_REF }}
          token: ${{ secrets.SIGNING_REPOSITORY_TOKEN }}
          path: .ci-signing-repo
          persist-credentials: false

      - name: Sign config
        shell: bash
        env:
          SIGNING_REPOSITORY_DIR: ${{ github.workspace }}/.ci-signing-repo
          SIGNING_APP_DIR: RustDesk
          SIGNING_OUTPUT_DIR: ${{ runner.temp }}/rustdesk-signing
        run: |
          set -euo pipefail
          .github/scripts/prepare-signing-config.sh
          echo "RUSTDESK_SIGNING_DIR=$SIGNING_OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          configured_version_name=$(jq -er '.app.versionName' AppScope/app.json5)
          if [[ "$configured_version_name" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\.([0-9]+))?$ ]]; then
            base_version_name="${BASH_REMATCH[1]}"
          else
            echo "Unsupported base versionName: $configured_version_name" >&2
            exit 1
          fi

          version_start_sha=''
          while IFS= read -r candidate; do
            if git show --format= --unified=0 "$candidate" -- AppScope/app.json5 \
              | grep -E '^\+.*"versionName"[[:space:]]*:[[:space:]]*"'"$base_version_name"'"' \
              >/dev/null; then
              version_start_sha="$candidate"
              break
            fi
          done < <(git log \
            -S "\"versionName\": \"$base_version_name\"" \
            --format=%H \
            -- AppScope/app.json5)
          if [[ -z "$version_start_sha" ]]; then
            echo "Unable to locate the commit that introduced base versionName $base_version_name." >&2
            exit 1
          fi
          version_start_epoch=$(git show -s --format=%ct "$version_start_sha")

          workflow_runs='[]'
          page=1
          while :; do
            runs_response=$(curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/build-private-har.yml/runs?per_page=100&page=$page")
            page_runs=$(jq -c \
              '[.workflow_runs[] | {created_at, run_attempt}]' \
              <<<"$runs_response")
            workflow_runs=$(jq -cn \
              --argjson accumulated "$workflow_runs" \
              --argjson current "$page_runs" \
              '$accumulated + $current')
            page_count=$(jq -r 'length' <<<"$page_runs")
            if (( page_count < 100 )); then
              break
            fi
            oldest_epoch=$(jq -er '.[-1].created_at | fromdateiso8601' <<<"$page_runs")
            if (( oldest_epoch < version_start_epoch )); then
              break
            fi
            ((page += 1))
          done

          today=$(date -u +%F)
          version_build_number=$(jq -er --argjson start "$version_start_epoch" \
            '[.[] | select((.created_at | fromdateiso8601) >= $start) | (.run_attempt // 1)] | add' \
            <<<"$workflow_runs")
          daily_build_number=$(jq -er --arg today "$today" \
            '[.[] | select(.created_at | startswith($today)) | (.run_attempt // 1)] | add' \
            <<<"$workflow_runs")
          if (( version_build_number < 1 )); then
            echo "Current-version build number must be positive: $version_build_number" >&2
            exit 1
          fi
          if (( daily_build_number < 1 || daily_build_number > 99 )); then
            echo "Daily build number is outside the supported range: $daily_build_number" >&2
            exit 1
          fi

          app_version_name="${base_version_name}.${version_build_number}"
          # versionCode must increase for every AppGallery upgrade. Day-of-year resets every
          # January, so use UTC days since a fixed epoch plus the daily run sequence instead.
          # The offset keeps this scheme above every previously published 10xxxxxx code.
          version_code_epoch=$(date -u -d '2020-01-01T00:00:00Z' +%s)
          current_epoch=$(date -u +%s)
          version_code_day=$(((current_epoch - version_code_epoch) / 86400))
          app_version_code=$((100000000 + version_code_day * 100 + daily_build_number))
          if (( app_version_code > 2147483647 )); then
            echo "App versionCode exceeds the HarmonyOS limit: $app_version_code" >&2
            exit 1
          fi
          app_json=$(mktemp)
          jq --arg version_name "$app_version_name" --argjson version_code "$app_version_code" \
            '.app.versionName = $version_name | .app.versionCode = $version_code' \
            AppScope/app.json5 > "$app_json"
          mv "$app_json" AppScope/app.json5

          echo "App version: $app_version_name ($app_version_code), version build: $version_build_number, UTC daily build: $daily_build_number"
          echo "app_version_name=$app_version_name" >> "$GITHUB_OUTPUT"
          echo "app_version_code=$app_version_code" >> "$GITHUB_OUTPUT"
          echo "build_number=$version_build_number" >> "$GITHUB_OUTPUT"
          echo "daily_build_number=$daily_build_number" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          hvigorw clean --no-daemon
          hvigorw assembleApp \
            -p product=publish \
            -p buildMode=release \
            --no-daemon \
            --no-incremental

      - name: Upload prep
        id: app
        shell: bash
        env:
          CORE_HAR_INTEGRITY: ${{ steps.ohpm.outputs.core_har_integrity }}
          CORE_HAR_VERSION: ${{ steps.ohpm.outputs.core_har_version }}
          APP_VERSION_NAME: ${{ steps.version.outputs.app_version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.app_version_code }}
        run: |
          set -euo pipefail

          signed_app="$(find build -type f -name '*-signed.app' -print -quit 2>/dev/null || true)"
          if [[ -z "$signed_app" ]]; then
            echo "Signed App was not produced." >&2
            exit 1
          fi

          mkdir -p ci-output
          output_app="ci-output/RustDesk-${CORE_HAR_VERSION}.app"
          cp "$signed_app" "$output_app"
          app_sha256="$(sha256sum "$output_app" | awk '{print $1}')"
          hap_entry="$(unzip -Z1 "$output_app" | awk '/\.hap$/ { print; exit }')"
          if [[ -z "$hap_entry" ]]; then
            echo "Signed App contains no HAP package." >&2
            exit 1
          fi
          hap_sha256="$(unzip -p "$output_app" "$hap_entry" | sha256sum | awk '{print $1}')"
          signing_sha="$(git -C .ci-signing-repo rev-parse HEAD)"
          jq -n \
            --argjson provenance_version 1 \
            --arg arkts_sha "$GITHUB_SHA" \
            --arg har_sha "$HAR_SHA" \
            --arg core_sha "$CORE_SHA" \
            --arg signing_sha "$signing_sha" \
            --arg package_name "$CORE_HAR_PACKAGE" \
            --arg package_version "$CORE_HAR_VERSION" \
            --arg package_integrity "$CORE_HAR_INTEGRITY" \
            --arg app_sha256 "$app_sha256" \
            --arg hap_entry "$hap_entry" \
            --arg hap_sha256 "$hap_sha256" \
            --arg app_version_name "$APP_VERSION_NAME" \
            --argjson app_version_code "$APP_VERSION_CODE" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              provenance_version: $provenance_version,
              arkts_sha: $arkts_sha,
              har_sha: $har_sha,
              core_sha: $core_sha,
              signing: {
                repository_sha: $signing_sha,
                configuration: "publish"
              },
              har_package: {
                name: $package_name,
                version: $package_version,
                integrity: $package_integrity
              },
              app: {
                sha256: $app_sha256,
                version_name: $app_version_name,
                version_code: $app_version_code,
                hap: {
                  entry: $hap_entry,
                  sha256: $hap_sha256
                }
              },
              ci: {
                run_id: $run_id,
                run_attempt: $run_attempt
              }
            }' > ci-output/release-provenance.json
          echo "App SHA-256: $app_sha256"
          echo "HAP SHA-256: $hap_sha256"
          echo "path=$output_app" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RustDesk-${{ steps.ohpm.outputs.core_har_version }}.app
          path: |
            ${{ steps.app.outputs.path }}
            ci-output/release-provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload and submit AGC test version
        if: ${{ env.AGC_ENABLED == 'true' }}
        id: agc
        env:
          AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
          AGC_APP_FILE: ${{ steps.app.outputs.path }}
          AGC_PERMISSION_VIDEO_FILE: ${{ github.workspace }}/.github/assets/permission-intro-intercept-input.mp4
          AGC_RESULT_FILE: ${{ github.workspace }}/ci-output/agc-release.json
          AGC_EVENT_NAME: ${{ github.event_name }}
          AGC_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGC_CORE_HAR_VERSION: ${{ steps.ohpm.outputs.core_har_version }}
          AGC_PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AGC_WORKFLOW_SHA: ${{ github.sha }}
        run: .github/scripts/agc-test-release.sh "$AGC_APP_FILE"

      - name: Upload AGC result
        if: ${{ always() && env.AGC_ENABLED == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RustDesk-${{ steps.ohpm.outputs.core_har_version }}-agc-ids
          path: ci-output/agc-release.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ohpm/.ohpmrc"
          rm -rf "$RUNNER_TEMP/rustdesk-signing"
          rm -rf "$GITHUB_WORKSPACE/.ci-signing-repo"
