name: Build ArkTS with private RustDesk HAR

on:
  repository_dispatch:
    types: [rustdesk-har-published]
  workflow_dispatch:
    inputs:
      har_version:
        description: Exact rustdesk-ohrs version in private OHPM
        required: true
        type: string
      core_sha:
        description: Expected Core commit (optional for manual recovery)
        required: false
        type: string
      har_sha256:
        description: Expected HAR SHA-256 (recorded in build receipt)
        required: false
        type: string
      har_integrity:
        description: Expected OHPM sha512 integrity (optional for manual recovery)
        required: false
        type: string
      product:
        description: App product
        required: true
        default: default
        type: choice
        options:
          - default
          - publish
      build_mode:
        description: App build mode
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: build-arkts-${{ github.event.client_payload.har_version || inputs.har_version || github.run_id }}
  cancel-in-progress: false

env:
  OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280
  NATIVE_PACKAGE_NAME: rustdesk-ohrs

jobs:
  build-app:
    name: Resolve private HAR and assemble App
    runs-on: ubuntu-22.04
    environment: harmonyos-ci-signing
    steps:
      - name: Resolve and validate build request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          PAYLOAD_HAR_VERSION: ${{ github.event.client_payload.har_version }}
          PAYLOAD_HAR_SHA256: ${{ github.event.client_payload.har_sha256 }}
          PAYLOAD_HAR_INTEGRITY: ${{ github.event.client_payload.har_integrity }}
          PAYLOAD_CORE_REPOSITORY: ${{ github.event.client_payload.core_repository }}
          PAYLOAD_CORE_SHA: ${{ github.event.client_payload.core_sha }}
          PAYLOAD_HAR_REPOSITORY: ${{ github.event.client_payload.har_repository }}
          PAYLOAD_HAR_SHA: ${{ github.event.client_payload.har_sha }}
          PAYLOAD_SOURCE_RUN_URL: ${{ github.event.client_payload.source_run_url }}
          INPUT_HAR_VERSION: ${{ inputs.har_version }}
          INPUT_CORE_SHA: ${{ inputs.core_sha }}
          INPUT_HAR_SHA256: ${{ inputs.har_sha256 }}
          INPUT_HAR_INTEGRITY: ${{ inputs.har_integrity }}
          INPUT_PRODUCT: ${{ inputs.product }}
          INPUT_BUILD_MODE: ${{ inputs.build_mode }}
          EXPECTED_HAR_REPOSITORY: ${{ vars.HAR_REPOSITORY }}
          AUTOMATIC_PRODUCT: ${{ vars.ARKTS_CI_PRODUCT }}
          AUTOMATIC_BUILD_MODE: ${{ vars.ARKTS_CI_BUILD_MODE }}
          LUMINOUS_PACKAGE: ${{ vars.LUMINOUS_NEO_PACKAGE }}
          LUMINOUS_VERSION: ${{ vars.LUMINOUS_NEO_VERSION }}
          SIGNING_REPOSITORY: ${{ vars.SIGNING_REPOSITORY }}
          SIGNING_REPOSITORY_REF: ${{ vars.SIGNING_REPOSITORY_REF }}
          SIGNING_BUNDLE_PATH: ${{ vars.SIGNING_BUNDLE_PATH }}
        run: |
          set -euo pipefail

          expected_har_repository="${EXPECTED_HAR_REPOSITORY:-FrankHan052176/RustDeskHar}"
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            package_name="$PAYLOAD_PACKAGE_NAME"
            har_version="$PAYLOAD_HAR_VERSION"
            har_sha256="$PAYLOAD_HAR_SHA256"
            har_integrity="$PAYLOAD_HAR_INTEGRITY"
            core_repository="$PAYLOAD_CORE_REPOSITORY"
            core_sha="$PAYLOAD_CORE_SHA"
            har_repository="$PAYLOAD_HAR_REPOSITORY"
            har_sha="$PAYLOAD_HAR_SHA"
            source_run_url="$PAYLOAD_SOURCE_RUN_URL"
            product="${AUTOMATIC_PRODUCT:-default}"
            build_mode="${AUTOMATIC_BUILD_MODE:-debug}"
          else
            package_name="$NATIVE_PACKAGE_NAME"
            har_version="$INPUT_HAR_VERSION"
            har_sha256="$INPUT_HAR_SHA256"
            har_integrity="$INPUT_HAR_INTEGRITY"
            core_repository=""
            core_sha="$INPUT_CORE_SHA"
            har_repository="$expected_har_repository"
            har_sha=""
            source_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            product="$INPUT_PRODUCT"
            build_mode="$INPUT_BUILD_MODE"
          fi

          if [[ "$package_name" != "$NATIVE_PACKAGE_NAME" ]]; then
            echo "Refusing unexpected native package: $package_name" >&2
            exit 2
          fi
          if [[ "$har_repository" != "$expected_har_repository" ]]; then
            echo "Refusing unexpected HAR repository: $har_repository" >&2
            exit 2
          fi
          if [[ ! "$har_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid HAR version: $har_version" >&2
            exit 2
          fi
          if [[ -n "$har_sha256" && ! "$har_sha256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Invalid HAR SHA-256." >&2
            exit 2
          fi
          if [[ -n "$har_integrity" && ! "$har_integrity" =~ ^sha512-[A-Za-z0-9+/=]+$ ]]; then
            echo "Invalid HAR integrity value." >&2
            exit 2
          fi
          if [[ -n "$core_sha" && ! "$core_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid Core SHA." >&2
            exit 2
          fi
          if [[ -n "$har_sha" && ! "$har_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid HAR source SHA." >&2
            exit 2
          fi
          if [[ "$EVENT_NAME" == "repository_dispatch" && \
                ( -z "$har_sha256" || -z "$har_integrity" || -z "$core_sha" || -z "$har_sha" ) ]]; then
            echo "Automated requests must include all provenance and integrity fields." >&2
            exit 2
          fi
          if [[ "$product" != "default" && "$product" != "publish" ]]; then
            echo "Unsupported product: $product" >&2
            exit 2
          fi
          if [[ "$build_mode" != "debug" && "$build_mode" != "release" ]]; then
            echo "Unsupported build mode: $build_mode" >&2
            exit 2
          fi

          luminous_package="${LUMINOUS_PACKAGE:-luminous_neo}"
          luminous_version="${LUMINOUS_VERSION:-}"
          if [[ ! "$luminous_package" =~ ^[a-z0-9._-]+$ ]]; then
            echo "Invalid Luminous Neo package name: $luminous_package" >&2
            exit 2
          fi
          if [[ ! "$luminous_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "LUMINOUS_NEO_VERSION must be an exact SemVer version." >&2
            exit 2
          fi

          signing_repository="${SIGNING_REPOSITORY:-}"
          signing_repository_ref="${SIGNING_REPOSITORY_REF:-}"
          signing_bundle_path="${SIGNING_BUNDLE_PATH:-rustdesk/signing-bundle.tar.gz.enc}"
          if [[ ! "$signing_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "SIGNING_REPOSITORY must name the dedicated private repository." >&2
            exit 2
          fi
          if [[ ! "$signing_repository_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "SIGNING_REPOSITORY_REF must pin an immutable 40-character commit." >&2
            exit 2
          fi
          if [[ "$signing_bundle_path" == /* || "$signing_bundle_path" == *".."* || \
                ! "$signing_bundle_path" =~ ^[A-Za-z0-9._/-]+\.enc$ ]]; then
            echo "Invalid SIGNING_BUNDLE_PATH." >&2
            exit 2
          fi

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "har_version=$har_version" >> "$GITHUB_OUTPUT"
          echo "har_sha256=$har_sha256" >> "$GITHUB_OUTPUT"
          echo "har_integrity=$har_integrity" >> "$GITHUB_OUTPUT"
          echo "core_repository=$core_repository" >> "$GITHUB_OUTPUT"
          echo "core_sha=$core_sha" >> "$GITHUB_OUTPUT"
          echo "har_repository=$har_repository" >> "$GITHUB_OUTPUT"
          echo "har_sha=$har_sha" >> "$GITHUB_OUTPUT"
          echo "source_run_url=$source_run_url" >> "$GITHUB_OUTPUT"
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "build_mode=$build_mode" >> "$GITHUB_OUTPUT"
          echo "luminous_package=$luminous_package" >> "$GITHUB_OUTPUT"
          echo "luminous_version=$luminous_version" >> "$GITHUB_OUTPUT"
          echo "signing_repository=$signing_repository" >> "$GITHUB_OUTPUT"
          echo "signing_repository_ref=$signing_repository_ref" >> "$GITHUB_OUTPUT"
          echo "signing_bundle_path=$signing_bundle_path" >> "$GITHUB_OUTPUT"

      - name: Checkout ArkTS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: Configure private OHPM read access
        shell: bash
        env:
          OHPM_READ_CONFIG: ${{ secrets.OHPM_READ_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${OHPM_READ_CONFIG:-}" ]]; then
            echo "OHPM_READ_CONFIG is not configured." >&2
            exit 2
          fi

          umask 077
          mkdir -p "$HOME/.ohpm"
          printf '%s\n' "$OHPM_READ_CONFIG" > "$HOME/.ohpm/.ohpmrc"
          rg -q '^registry[[:space:]]*=' "$HOME/.ohpm/.ohpmrc" || {
            echo "OHPM_READ_CONFIG must define registry." >&2
            exit 2
          }

      - name: Resolve exact private dependencies
        shell: bash
        env:
          NATIVE_VERSION: ${{ steps.request.outputs.har_version }}
          LUMINOUS_PACKAGE: ${{ steps.request.outputs.luminous_package }}
          LUMINOUS_VERSION: ${{ steps.request.outputs.luminous_version }}
        run: |
          set -euo pipefail

          if [[ -z "${GITHUB_WORKSPACE:-}" || "$GITHUB_WORKSPACE" == "/" ]]; then
            echo "Unsafe GitHub workspace path." >&2
            exit 2
          fi

          jq --arg version "$NATIVE_VERSION" \
             '.dependencies["rustdesk-ohrs"] = $version' \
             oh-package.json5 > oh-package.ci.json5
          mv oh-package.ci.json5 oh-package.json5

          jq --arg package "$LUMINOUS_PACKAGE" \
             --arg version "$LUMINOUS_VERSION" \
             '.dependencies[$package] = $version' \
             entry/oh-package.json5 > entry/oh-package.ci.json5
          mv entry/oh-package.ci.json5 entry/oh-package.json5

          rm -f oh-package-lock.json5 entry/oh-package-lock.json5
          rm -rf "$GITHUB_WORKSPACE/oh_modules" "$GITHUB_WORKSPACE/entry/oh_modules"

          ohpm --version
          ohpm install --all --lockfile_stable_order true
          (
            cd entry
            ohpm install --lockfile_stable_order true
          )

      - name: Verify installed package identity and provenance
        shell: bash
        env:
          NATIVE_VERSION: ${{ steps.request.outputs.har_version }}
          EXPECTED_INTEGRITY: ${{ steps.request.outputs.har_integrity }}
          EXPECTED_CORE_SHA: ${{ steps.request.outputs.core_sha }}
          LUMINOUS_PACKAGE: ${{ steps.request.outputs.luminous_package }}
          LUMINOUS_VERSION: ${{ steps.request.outputs.luminous_version }}
        run: |
          set -euo pipefail

          jq -e --arg name "$NATIVE_PACKAGE_NAME" \
                --arg version "$NATIVE_VERSION" \
                --arg integrity "$EXPECTED_INTEGRITY" '
            any(.packages[];
              .name == $name and
              .version == $version and
              .registryType == "ohpm" and
              ($integrity == "" or .integrity == $integrity))
          ' oh-package-lock.json5 >/dev/null

          jq -e --arg name "$LUMINOUS_PACKAGE" \
                --arg version "$LUMINOUS_VERSION" '
            any(.packages[];
              .name == $name and
              .version == $version and
              .registryType == "ohpm")
          ' entry/oh-package-lock.json5 >/dev/null

          provenance_found=false
          while IFS= read -r provenance_file; do
            provenance_found=true
            jq -e --arg name "$NATIVE_PACKAGE_NAME" \
                  --arg version "$NATIVE_VERSION" \
                  --arg core_sha "$EXPECTED_CORE_SHA" '
              .packageName == $name and
              .packageVersion == $version and
              ($core_sha == "" or .coreCommit == $core_sha)
            ' "$provenance_file" >/dev/null
          done < <(find oh_modules entry/oh_modules -type f \
            -path '*/rustdesk-ohrs/BUILD_PROVENANCE.json' -print 2>/dev/null)

          if [[ "$provenance_found" != "true" ]]; then
            echo "Installed rustdesk-ohrs package has no BUILD_PROVENANCE.json." >&2
            exit 2
          fi

      - name: Checkout encrypted signing bundle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.request.outputs.signing_repository }}
          ref: ${{ steps.request.outputs.signing_repository_ref }}
          token: ${{ secrets.SIGNING_REPO_TOKEN }}
          path: .ci-signing-repo
          persist-credentials: false

      - name: Decrypt ephemeral signing material
        shell: bash
        env:
          SIGNING_BUNDLE_PASSWORD: ${{ secrets.SIGNING_BUNDLE_PASSWORD }}
          SIGNING_BUNDLE_PATH: ${{ steps.request.outputs.signing_bundle_path }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_BUNDLE_PASSWORD:-}" ]]; then
            echo "SIGNING_BUNDLE_PASSWORD is not configured." >&2
            exit 2
          fi

          encrypted_bundle="$GITHUB_WORKSPACE/.ci-signing-repo/$SIGNING_BUNDLE_PATH"
          signing_root="$RUNNER_TEMP/rustdesk-signing"
          signing_archive="$RUNNER_TEMP/rustdesk-signing.tar.gz"
          test -s "$encrypted_bundle"
          case "$signing_root" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "Unsafe signing output path." >&2; exit 2 ;;
          esac

          rm -rf "$signing_root"
          rm -f "$signing_archive"
          mkdir -p "$signing_root"
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted_bundle" \
            -out "$signing_archive" \
            -pass env:SIGNING_BUNDLE_PASSWORD

          if tar -tzf "$signing_archive" | rg -q '(^/|(^|/)\.\.(/|$))'; then
            echo "Signing archive contains an unsafe path." >&2
            exit 2
          fi
          tar -xzf "$signing_archive" -C "$signing_root"
          test -s "$signing_root/signingConfigs.json"
          test -d "$signing_root/materials"
          rg -q '__SIGNING_ROOT__/materials/' "$signing_root/signingConfigs.json"

          jq -e '
            type == "array" and
            length > 0 and
            any(.[]; .name == "default") and
            any(.[]; .name == "publish")
          ' "$signing_root/signingConfigs.json" >/dev/null

          material_root="$(realpath "$signing_root/materials")"
          while IFS= read -r material_path; do
            case "$material_path" in
              __SIGNING_ROOT__/materials/*) ;;
              *) echo "Signing material path must use __SIGNING_ROOT__/materials/." >&2; exit 2 ;;
            esac
            resolved_path="${material_path/__SIGNING_ROOT__/$signing_root}"
            real_material_path="$(realpath "$resolved_path")"
            case "$real_material_path" in
              "$material_root"/*) ;;
              *) echo "Signing material escapes the materials directory." >&2; exit 2 ;;
            esac
            test -s "$real_material_path"
          done < <(jq -r '
            .[].material |
            [.storeFile, .profile, .certpath] | .[]
          ' "$signing_root/signingConfigs.json")

          echo "RUSTDESK_SIGNING_DIR=$signing_root" >> "$GITHUB_ENV"

      - name: Confirm App-level build task
        shell: bash
        run: |
          hvigorw --version
          hvigorw tasks --no-daemon | rg -q 'assembleApp'

      - name: Assemble signed HarmonyOS App
        shell: bash
        env:
          BUILD_PRODUCT: ${{ steps.request.outputs.product }}
          BUILD_MODE: ${{ steps.request.outputs.build_mode }}
        run: |
          set -euo pipefail
          hvigorw assembleApp \
            -p "product=$BUILD_PRODUCT" \
            -p "buildMode=$BUILD_MODE" \
            --no-daemon \
            --no-incremental

      - name: Verify App and write build receipt
        id: app
        shell: bash
        env:
          BUILD_PRODUCT: ${{ steps.request.outputs.product }}
          BUILD_MODE: ${{ steps.request.outputs.build_mode }}
          HAR_VERSION: ${{ steps.request.outputs.har_version }}
          HAR_SHA256: ${{ steps.request.outputs.har_sha256 }}
          HAR_INTEGRITY: ${{ steps.request.outputs.har_integrity }}
          CORE_REPOSITORY: ${{ steps.request.outputs.core_repository }}
          CORE_SHA: ${{ steps.request.outputs.core_sha }}
          HAR_REPOSITORY: ${{ steps.request.outputs.har_repository }}
          HAR_SHA: ${{ steps.request.outputs.har_sha }}
          SOURCE_RUN_URL: ${{ steps.request.outputs.source_run_url }}
          LUMINOUS_PACKAGE: ${{ steps.request.outputs.luminous_package }}
          LUMINOUS_VERSION: ${{ steps.request.outputs.luminous_version }}
        run: |
          set -euo pipefail

          source_app="build/outputs/$BUILD_PRODUCT/R_RustDesk-ArkTS-$BUILD_PRODUCT-signed.app"
          test -s "$source_app"
          mkdir -p ci-output
          output_app="ci-output/RustDesk-${BUILD_PRODUCT}-${BUILD_MODE}-${HAR_VERSION}.app"
          cp "$source_app" "$output_app"
          app_sha256="$(sha256sum "$output_app" | awk '{print $1}')"
          action_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -n \
            --arg arkts_repository "$GITHUB_REPOSITORY" \
            --arg arkts_sha "$GITHUB_SHA" \
            --arg product "$BUILD_PRODUCT" \
            --arg build_mode "$BUILD_MODE" \
            --arg app_sha256 "$app_sha256" \
            --arg native_package "$NATIVE_PACKAGE_NAME" \
            --arg har_version "$HAR_VERSION" \
            --arg har_sha256 "$HAR_SHA256" \
            --arg har_integrity "$HAR_INTEGRITY" \
            --arg core_repository "$CORE_REPOSITORY" \
            --arg core_sha "$CORE_SHA" \
            --arg har_repository "$HAR_REPOSITORY" \
            --arg har_sha "$HAR_SHA" \
            --arg luminous_package "$LUMINOUS_PACKAGE" \
            --arg luminous_version "$LUMINOUS_VERSION" \
            --arg source_run_url "$SOURCE_RUN_URL" \
            --arg action_run_url "$action_run_url" \
            '{
              schemaVersion: 1,
              arktsRepository: $arkts_repository,
              arktsCommit: $arkts_sha,
              product: $product,
              buildMode: $build_mode,
              appSha256: $app_sha256,
              nativePackage: $native_package,
              harVersion: $har_version,
              harSha256: $har_sha256,
              harIntegrity: $har_integrity,
              coreRepository: $core_repository,
              coreCommit: $core_sha,
              harRepository: $har_repository,
              harCommit: $har_sha,
              luminousPackage: $luminous_package,
              luminousVersion: $luminous_version,
              sourceRunUrl: $source_run_url,
              actionRunUrl: $action_run_url
            }' > ci-output/build-receipt.json

          echo "sha256=$app_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload signed App and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RustDesk-${{ steps.request.outputs.product }}-${{ steps.request.outputs.build_mode }}-${{ steps.request.outputs.har_version }}
          path: ci-output/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove ephemeral credentials and decrypted signing material
        if: always()
        shell: bash
        run: |
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" == "/" || \
                -z "${GITHUB_WORKSPACE:-}" || "$GITHUB_WORKSPACE" == "/" ]]; then
            echo "Unsafe cleanup path." >&2
            exit 2
          fi
          signing_root="$RUNNER_TEMP/rustdesk-signing"
          signing_archive="$RUNNER_TEMP/rustdesk-signing.tar.gz"
          signing_checkout="$GITHUB_WORKSPACE/.ci-signing-repo"
          case "$signing_root" in
            "$RUNNER_TEMP"/*) rm -rf "$signing_root" ;;
          esac
          case "$signing_checkout" in
            "$GITHUB_WORKSPACE"/*) rm -rf "$signing_checkout" ;;
          esac
          rm -f "$signing_archive"
          rm -f "$HOME/.ohpm/.ohpmrc"
