name: Build Resk HarmonyOS App

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [rd-engine-har-published]
  workflow_dispatch:
    inputs:
      package_name:
        description: HAR package produced by rd-engine/native/ohos_napi
        required: true
        default: rustdesk-ohrs
        type: string
      package_version:
        description: Exact immutable rd-engine HAR version to build
        required: true
        type: string
      engine_sha:
        description: Full rd-engine commit SHA used to build the HAR
        required: true
        type: string
      publish_test:
        description: Explicitly upload and submit an AGC invitation test version
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'push-validation' || format('{0}-{1}', github.event_name, github.event.client_payload.package_version || inputs.package_version || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280
  RD_ENGINE_HAR_PACKAGE: rustdesk-ohrs
  RD_ENGINE_HAR_REGISTRY: https://devrepo.devcloud.cn-north-4.huaweicloud.com/artgalaxy/api/ohpm/cn-north-4_c07b1b38744f424b8d87a86532d38003_ohpm_1/
  LUMINOUS_NEO_VERSION: 1.0.2
  SIGNING_REPOSITORY: ${{ vars.SIGNING_REPOSITORY || 'FrankHan052176/AppGallerySigning' }}
  SIGNING_REPOSITORY_REF: ${{ vars.SIGNING_REPOSITORY_REF || '70779bd9e42c8565772dd8c43c80b89a197c3369' }}
  # No client_payload field can enable AGC. Push and repository_dispatch only build artifacts.
  AGC_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_test == true && secrets.AGC_CLIENT_ID != '' && secrets.AGC_CLIENT_SECRET != '' && secrets.AGC_APP_ID != '' }}
  AGC_API_DOMAIN: ${{ vars.AGC_API_DOMAIN || 'connect-api.cloud.huawei.com' }}
  AGC_TEST_DURATION_DAYS: ${{ vars.AGC_TEST_DURATION_DAYS || '14' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    environment: harmonyos-ci-signing
    steps:
      - name: Setup
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select immutable rd-engine HAR
        shell: bash
        env:
          DISPATCH_PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          DISPATCH_PACKAGE_VERSION: ${{ github.event.client_payload.package_version }}
          DISPATCH_ENGINE_SHA: ${{ github.event.client_payload.engine_sha }}
          MANUAL_PACKAGE_NAME: ${{ inputs.package_name }}
          MANUAL_PACKAGE_VERSION: ${{ inputs.package_version }}
          MANUAL_ENGINE_SHA: ${{ inputs.engine_sha }}
          PUSH_PACKAGE_VERSION: ${{ vars.RD_ENGINE_HAR_VERSION }}
          PUSH_ENGINE_SHA: ${{ vars.RD_ENGINE_SHA }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            repository_dispatch)
              package_name="$DISPATCH_PACKAGE_NAME"
              package_version="$DISPATCH_PACKAGE_VERSION"
              engine_sha="$DISPATCH_ENGINE_SHA"
              ;;
            workflow_dispatch)
              package_name="$MANUAL_PACKAGE_NAME"
              package_version="$MANUAL_PACKAGE_VERSION"
              engine_sha="$MANUAL_ENGINE_SHA"
              ;;
            push)
              package_name="$RD_ENGINE_HAR_PACKAGE"
              package_version="$PUSH_PACKAGE_VERSION"
              engine_sha="$PUSH_ENGINE_SHA"
              ;;
            *) echo 'Unsupported build event.' >&2; exit 1 ;;
          esac
          if [[ "$package_name" != "$RD_ENGINE_HAR_PACKAGE" ]]; then
            echo 'Only the rd-engine rustdesk-ohrs package is accepted.' >&2
            exit 1
          fi
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'An exact HAR semantic version is required; for push set RD_ENGINE_HAR_VERSION.' >&2
            exit 1
          fi
          if [[ ! "$engine_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'A full rd-engine SHA is required; for push set RD_ENGINE_SHA.' >&2
            exit 1
          fi
          if [[ ! "$SIGNING_REPOSITORY_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'SIGNING_REPOSITORY_REF must pin a full commit, not a moving branch or tag.' >&2
            exit 1
          fi
          {
            echo "RD_ENGINE_HAR_VERSION=$package_version"
            echo "RD_ENGINE_SHA=${engine_sha,,}"
          } >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup HarmonyOS
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: Install and verify rd-engine HAR
        id: ohpm
        shell: bash
        env:
          CODEARTS_PRIVATE_OHPM_READ: ${{ secrets.CODEARTS_PRIVATE_OHPM_READ }}
        run: |
          set -euo pipefail
          private_config="$HOME/.ohpm/.ohpmrc"
          private_log="$RUNNER_TEMP/resk-ohpm-private.log"
          trap 'rm -f "$private_config" "$private_log"' EXIT
          umask 077
          # Keep only this registry's read credential. Never inherit a global private registry
          # or strict_ssl=false from a supplied config, and never echo its contents.
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          registry = urlsplit(os.environ['RD_ENGINE_HAR_REGISTRY'])
          auth_key = '//' + registry.netloc + registry.path + ':_auth'
          values = []
          for line in os.environ.get('CODEARTS_PRIVATE_OHPM_READ', '').splitlines():
              key, separator, value = line.partition('=')
              if separator and key.strip() == auth_key:
                  values.append(value.strip())
          if len(values) != 1 or not values[0]:
              raise SystemExit('CodeArts config requires one scoped read credential')
          config = Path.home() / '.ohpm/.ohpmrc'
          config.parent.mkdir(parents=True, exist_ok=True)
          descriptor = os.open(config, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(descriptor, 'w') as output:
              os.fchmod(output.fileno(), 0o600)
              output.write(auth_key + '=' + values[0] + '\nstrict_ssl=true\n')
          PY
          unset CODEARTS_PRIVATE_OHPM_READ

          # Replace only the HAR dependency in this disposable checkout. Ordinary public
          # dependencies and the committed local-development manifests/locks are not repinned.
          package_json=$(mktemp)
          jq --arg version "$RD_ENGINE_HAR_VERSION" \
            '.dependencies["rustdesk-ohrs"] = $version' oh-package.json5 > "$package_json"
          mv "$package_json" oh-package.json5
          rm -rf "oh_modules/$RD_ENGINE_HAR_PACKAGE"
          echo "Installing rd-engine HAR: $RD_ENGINE_HAR_PACKAGE@$RD_ENGINE_HAR_VERSION"
          if ! ohpm install "$RD_ENGINE_HAR_PACKAGE@$RD_ENGINE_HAR_VERSION" \
            --registry "$RD_ENGINE_HAR_REGISTRY" \
            --retry_times 5 --retry_interval 3000 > "$private_log" 2>&1; then
            echo 'Private HAR installation failed; authenticated CLI output is not published.' >&2
            exit 1
          fi
          if ! (
            cd entry
            ohpm install "luminous_neo@$LUMINOUS_NEO_VERSION" \
              --registry "$RD_ENGINE_HAR_REGISTRY" \
              --retry_times 5 --retry_interval 3000
          ) > "$private_log" 2>&1; then
            echo 'Private luminous_neo installation failed; authenticated CLI output is not published.' >&2
            exit 1
          fi
          rm -f "$private_config" "$private_log"
          trap - EXIT

          # No private auth or global private registry for normal public dependency resolution.
          ohpm install
          (
            cd entry
            ohpm install
          )

          mkdir -p ci-output
          # OHPM supplies the installed package, not the producer's adjacent archive sidecar.
          # Validate real installed metadata, schema 2, source, both AArch64 ELFs and hashes.
          python3 scripts/verify-native-har.py \
            --installed "oh_modules/$RD_ENGINE_HAR_PACKAGE" \
            --expected-engine-sha "$RD_ENGINE_SHA" \
            --expected-package-version "$RD_ENGINE_HAR_VERSION" \
            --require-clean > ci-output/har-provenance.json
          har_integrity="$(jq -er --arg name "$RD_ENGINE_HAR_PACKAGE" --arg version "$RD_ENGINE_HAR_VERSION" \
            '[.packages[] | select(.name == $name and .version == $version) | .integrity // empty] | unique | if length == 1 then .[0] else error("missing or ambiguous HAR integrity") end' \
            oh-package-lock.json5)"
          if [[ ! "$har_integrity" =~ ^sha(256|512)-[A-Za-z0-9+/]+=*$ ]]; then
            echo 'OHPM lock carries no supported HAR integrity.' >&2
            exit 1
          fi
          luminous_neo_version="$(jq -er '.version' entry/oh_modules/luminous_neo/oh-package.json5)"
          if [[ "$luminous_neo_version" != "$LUMINOUS_NEO_VERSION" ]]; then
            echo "Expected luminous_neo@$LUMINOUS_NEO_VERSION, got $luminous_neo_version" >&2
            exit 1
          fi
          echo "HAR package: $RD_ENGINE_HAR_PACKAGE@$RD_ENGINE_HAR_VERSION"
          echo "HAR lock integrity: $har_integrity"
          echo "Luminous Neo version: $luminous_neo_version"
          echo "har_version=$RD_ENGINE_HAR_VERSION" >> "$GITHUB_OUTPUT"
          echo "har_integrity=$har_integrity" >> "$GITHUB_OUTPUT"

      - name: Sign
        id: signing
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SIGNING_REPOSITORY }}
          ref: ${{ env.SIGNING_REPOSITORY_REF }}
          token: ${{ secrets.SIGNING_REPOSITORY_TOKEN }}
          path: .ci-signing-repo
          persist-credentials: false

      - name: Sign config
        shell: bash
        env:
          SIGNING_REPOSITORY_DIR: ${{ github.workspace }}/.ci-signing-repo
          SIGNING_APP_DIR: RustDesk
          SIGNING_OUTPUT_DIR: ${{ runner.temp }}/rustdesk-signing
        run: |
          set -euo pipefail
          .github/scripts/prepare-signing-config.sh
          echo "RUSTDESK_SIGNING_DIR=$SIGNING_OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          configured_version_name=$(jq -er '.app.versionName' AppScope/app.json5)
          if [[ "$configured_version_name" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\.([0-9]+))?$ ]]; then
            base_version_name="${BASH_REMATCH[1]}"
          else
            echo "Unsupported base versionName: $configured_version_name" >&2
            exit 1
          fi

          run_number=$((10#$GITHUB_RUN_NUMBER))
          run_attempt=$((10#$GITHUB_RUN_ATTEMPT))
          if (( run_number < 1 )); then
            echo "GitHub workflow run number must be positive: $run_number" >&2
            exit 1
          fi
          if (( run_attempt < 1 || run_attempt > 99 )); then
            echo "GitHub workflow run attempt is outside the supported range: $run_attempt" >&2
            exit 1
          fi

          # Preserve the existing version identity derived from the immutable workflow run.
          version_code_epoch=$(date -u -d '2020-01-01T00:00:00Z' +%s)
          current_epoch=$(date -u +%s)
          version_code_day=$(((current_epoch - version_code_epoch) / 86400))
          version_sequence=$((run_number * 100 + run_attempt))
          version_suffix=$((version_code_day * 100000 + version_sequence))
          app_version_name="${base_version_name}.${version_suffix}"
          app_version_code=$((100000000 + version_suffix))
          if (( app_version_code > 2147483647 )); then
            echo "App versionCode exceeds the HarmonyOS limit: $app_version_code" >&2
            exit 1
          fi
          app_json=$(mktemp)
          jq --arg version_name "$app_version_name" --argjson version_code "$app_version_code" \
            '.app.versionName = $version_name | .app.versionCode = $version_code' \
            AppScope/app.json5 > "$app_json"
          mv "$app_json" AppScope/app.json5

          echo "App version: $app_version_name ($app_version_code), workflow run: $run_number, attempt: $run_attempt"
          echo "app_version_name=$app_version_name" >> "$GITHUB_OUTPUT"
          echo "app_version_code=$app_version_code" >> "$GITHUB_OUTPUT"
          echo "run_number=$run_number" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          hvigorw clean --no-daemon
          hvigorw assembleApp \
            -p product=publish \
            -p buildMode=release \
            --no-daemon \
            --no-incremental

      - name: Upload prep
        id: app
        shell: bash
        env:
          HAR_INTEGRITY: ${{ steps.ohpm.outputs.har_integrity }}
          APP_VERSION_NAME: ${{ steps.version.outputs.app_version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.app_version_code }}
        run: |
          set -euo pipefail

          signed_app="$(find build -type f -name '*-signed.app' -print -quit 2>/dev/null || true)"
          if [[ -z "$signed_app" ]]; then
            echo 'Signed App was not produced.' >&2
            exit 1
          fi

          output_app="ci-output/RustDesk-${RD_ENGINE_HAR_VERSION}.app"
          cp "$signed_app" "$output_app"
          app_sha256="$(sha256sum "$output_app" | awk '{print $1}')"
          hap_entry="$(unzip -Z1 "$output_app" | awk '/\.hap$/ { print; exit }')"
          if [[ -z "$hap_entry" ]]; then
            echo 'Signed App contains no HAP package.' >&2
            exit 1
          fi
          hap_sha256="$(unzip -p "$output_app" "$hap_entry" | sha256sum | awk '{print $1}')"
          signing_sha="$(git -C .ci-signing-repo rev-parse HEAD)"
          jq -n \
            --argjson provenance_version 3 \
            --arg arkts_sha "$GITHUB_SHA" \
            --arg signing_sha "$signing_sha" \
            --arg package_integrity "$HAR_INTEGRITY" \
            --slurpfile har ci-output/har-provenance.json \
            --arg app_sha256 "$app_sha256" \
            --arg hap_entry "$hap_entry" \
            --arg hap_sha256 "$hap_sha256" \
            --arg app_version_name "$APP_VERSION_NAME" \
            --argjson app_version_code "$APP_VERSION_CODE" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              provenance_version: $provenance_version,
              arkts_sha: $arkts_sha,
              engine_repository: $har[0].engine_repository,
              engine_sha: $har[0].engine_sha,
              signing: {
                repository_sha: $signing_sha,
                configuration: "publish"
              },
              har_package: {
                name: $har[0].package_name,
                version: $har[0].package_version,
                integrity: $package_integrity,
                provenance_version: $har[0].provenance_version,
                target: $har[0].target,
                source_dirty: $har[0].source_dirty,
                library_sha256: $har[0].library_sha256,
                libcxx_sha256: $har[0].libcxx_sha256,
                verification_scope: "installed-package-static"
              },
              runtime_verified: false,
              app: {
                sha256: $app_sha256,
                version_name: $app_version_name,
                version_code: $app_version_code,
                hap: {
                  entry: $hap_entry,
                  sha256: $hap_sha256
                }
              },
              ci: {
                run_id: $run_id,
                run_attempt: $run_attempt
              }
            }' > ci-output/release-provenance.json
          echo "App SHA-256: $app_sha256"
          echo "HAP SHA-256: $hap_sha256"
          echo "path=$output_app" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RustDesk-${{ steps.ohpm.outputs.har_version }}.app
          path: |
            ${{ steps.app.outputs.path }}
            ci-output/release-provenance.json
            ci-output/har-provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload and submit AGC test version
        if: ${{ env.AGC_ENABLED == 'true' }}
        id: agc
        env:
          AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
          AGC_APP_FILE: ${{ steps.app.outputs.path }}
          AGC_PERMISSION_VIDEO_FILE: ${{ github.workspace }}/.github/assets/permission-intro-intercept-input.mp4
          AGC_RESULT_FILE: ${{ github.workspace }}/ci-output/agc-release.json
          AGC_EVENT_NAME: ${{ github.event_name }}
          AGC_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGC_CORE_HAR_VERSION: ${{ steps.ohpm.outputs.har_version }}
          AGC_PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AGC_WORKFLOW_SHA: ${{ github.sha }}
        run: .github/scripts/agc-test-release.sh "$AGC_APP_FILE"

      - name: Upload AGC result
        if: ${{ always() && env.AGC_ENABLED == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RustDesk-${{ steps.ohpm.outputs.har_version }}-agc-ids
          path: ci-output/agc-release.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ohpm/.ohpmrc" "$RUNNER_TEMP/resk-ohpm-private.log"
          rm -rf "$RUNNER_TEMP/rustdesk-signing"
          rm -rf "$GITHUB_WORKSPACE/.ci-signing-repo"
