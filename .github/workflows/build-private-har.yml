name: ohos

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [rustdesk-har-published]
  workflow_dispatch:
    inputs:
      package_name:
        description: Core HAR package published by RustDeskHar
        required: true
        default: rustdesk-ohrs
        type: string

permissions:
  actions: read
  contents: read

env:
  OHOS_COMMAND_LINE_TOOLS_VERSION: 6.1.1.280
  CORE_HAR_PACKAGE: ${{ github.event.client_payload.package_name || inputs.package_name || 'rustdesk-ohrs' }}
  CORE_HAR_REGISTRY: https://devrepo.devcloud.cn-north-4.huaweicloud.com/artgalaxy/api/ohpm/cn-north-4_c07b1b38744f424b8d87a86532d38003_ohpm_1/
  SIGNING_REPOSITORY: ${{ vars.SIGNING_REPOSITORY || 'FrankHan052176/AppGallerySigning' }}
  SIGNING_REPOSITORY_REF: ${{ vars.SIGNING_REPOSITORY_REF || '70779bd9e42c8565772dd8c43c80b89a197c3369' }}
  AGC_ENABLED: ${{ secrets.AGC_CLIENT_ID != '' && secrets.AGC_CLIENT_SECRET != '' && secrets.AGC_APP_ID != '' }}
  AGC_API_DOMAIN: ${{ vars.AGC_API_DOMAIN || 'connect-api.cloud.huawei.com' }}
  AGC_TEST_DURATION_DAYS: ${{ vars.AGC_TEST_DURATION_DAYS || '14' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    environment: harmonyos-ci-signing
    steps:
      - name: Setup
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup HarmonyOS
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: ${{ env.OHOS_COMMAND_LINE_TOOLS_VERSION }}
          cache: true

      - name: ohpm
        id: ohpm
        shell: bash
        env:
          CODEARTS_PRIVATE_OHPM_READ: ${{ secrets.CODEARTS_PRIVATE_OHPM_READ }}
        run: |
          private_config="$HOME/.ohpm/.ohpmrc"
          mkdir -p "$HOME/.ohpm"
          printf '%s' "$CODEARTS_PRIVATE_OHPM_READ" > "$private_config"

          ohpm uninstall rustdesk-ohrs
          echo "Installing Core HAR: $CORE_HAR_PACKAGE"
          ohpm install "${CORE_HAR_PACKAGE}@latest" \
            --registry "$CORE_HAR_REGISTRY" \
            --retry_times 5 \
            --retry_interval 3000
          (
            cd entry
            ohpm install \
              --registry "$CORE_HAR_REGISTRY" \
              --retry_times 5 \
              --retry_interval 3000
          )

          ohpm install
          (
            cd entry
            ohpm install
          )
          rm -f "$private_config"

          core_har_version="$(jq -er '.version' "oh_modules/${CORE_HAR_PACKAGE}/oh-package.json5")"
          echo "Core HAR version: $core_har_version"
          echo "core_har_version=$core_har_version" >> "$GITHUB_OUTPUT"

      - name: Sign
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SIGNING_REPOSITORY }}
          ref: ${{ env.SIGNING_REPOSITORY_REF }}
          token: ${{ secrets.SIGNING_REPOSITORY_TOKEN }}
          path: .ci-signing-repo
          persist-credentials: false

      - name: Sign config
        shell: bash
        env:
          SIGNING_REPOSITORY_DIR: ${{ github.workspace }}/.ci-signing-repo
          SIGNING_APP_DIR: RustDesk
          SIGNING_OUTPUT_DIR: ${{ runner.temp }}/rustdesk-signing
        run: |
          set -euo pipefail
          .github/scripts/prepare-signing-config.sh
          echo "RUSTDESK_SIGNING_DIR=$SIGNING_OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          base_version_name=$(jq -er '.app.versionName' AppScope/app.json5)
          if [[ "$base_version_name" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\.[0-9]+)?$ ]]; then
            base_version_name="${BASH_REMATCH[1]}"
          else
            echo "Unsupported base versionName: $base_version_name" >&2
            exit 1
          fi

          version_start_sha=$(git log \
            -S "\"versionName\": \"$base_version_name\"" \
            --format=%H \
            -1 \
            -- AppScope/app.json5)
          if [[ -z "$version_start_sha" ]]; then
            echo "Unable to locate the commit that introduced versionName $base_version_name." >&2
            exit 1
          fi
          version_start_epoch=$(git show -s --format=%ct "$version_start_sha")

          workflow_runs='[]'
          page=1
          while :; do
            runs_response=$(curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/build-private-har.yml/runs?per_page=100&page=$page")
            page_runs=$(jq -c \
              '[.workflow_runs[] | {created_at, run_attempt}]' \
              <<<"$runs_response")
            workflow_runs=$(jq -cn \
              --argjson accumulated "$workflow_runs" \
              --argjson current "$page_runs" \
              '$accumulated + $current')
            page_count=$(jq -r 'length' <<<"$page_runs")
            if (( page_count < 100 )); then
              break
            fi
            oldest_epoch=$(jq -er '.[-1].created_at | fromdateiso8601' <<<"$page_runs")
            if (( oldest_epoch < version_start_epoch )); then
              break
            fi
            ((page += 1))
          done

          today=$(date -u +%F)
          day_of_year=$(date -u +%j)
          version_build_number=$(jq -er --argjson start "$version_start_epoch" \
            '[.[] | select((.created_at | fromdateiso8601) >= $start) | (.run_attempt // 1)] | add' \
            <<<"$workflow_runs")
          daily_build_number=$(jq -er --arg today "$today" \
            '[.[] | select(.created_at | startswith($today)) | (.run_attempt // 1)] | add' \
            <<<"$workflow_runs")
          if (( version_build_number < 1 )); then
            echo "Current-version build number must be positive: $version_build_number" >&2
            exit 1
          fi
          if (( daily_build_number < 1 || daily_build_number > 99 )); then
            echo "Daily build number is outside the supported range: $daily_build_number" >&2
            exit 1
          fi

          version_code_prefix=${base_version_name//./}
          app_version_name="${base_version_name}.${version_build_number}"
          app_version_code="${version_code_prefix}${day_of_year}$(printf '%02d' "$daily_build_number")"
          app_version_code=$((10#$app_version_code))
          app_json=$(mktemp)
          jq --arg version_name "$app_version_name" --argjson version_code "$app_version_code" \
            '.app.versionName = $version_name | .app.versionCode = $version_code' \
            AppScope/app.json5 > "$app_json"
          mv "$app_json" AppScope/app.json5

          echo "App version: $app_version_name ($app_version_code), version build: $version_build_number, UTC daily build: $daily_build_number"
          echo "app_version_name=$app_version_name" >> "$GITHUB_OUTPUT"
          echo "app_version_code=$app_version_code" >> "$GITHUB_OUTPUT"
          echo "build_number=$version_build_number" >> "$GITHUB_OUTPUT"
          echo "daily_build_number=$daily_build_number" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          hvigorw clean --no-daemon
          hvigorw assembleApp \
            -p product=publish \
            -p buildMode=release \
            --no-daemon \
            --no-incremental

      - name: Upload prep
        id: app
        shell: bash
        env:
          CORE_HAR_VERSION: ${{ steps.ohpm.outputs.core_har_version }}
        run: |
          set -euo pipefail

          signed_app="$(find build -type f -name '*-signed.app' -print -quit 2>/dev/null || true)"
          if [[ -z "$signed_app" ]]; then
            echo "Signed App was not produced." >&2
            exit 1
          fi

          mkdir -p ci-output
          output_app="ci-output/RustDesk-${CORE_HAR_VERSION}.app"
          cp "$signed_app" "$output_app"
          echo "path=$output_app" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RustDesk-${{ steps.ohpm.outputs.core_har_version }}.app
          path: ${{ steps.app.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload and submit AGC test version
        if: ${{ env.AGC_ENABLED == 'true' }}
        id: agc
        env:
          AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
          AGC_APP_FILE: ${{ steps.app.outputs.path }}
          AGC_PERMISSION_VIDEO_FILE: ${{ github.workspace }}/.github/assets/permission-intro-intercept-input.mp4
          AGC_RESULT_FILE: ${{ github.workspace }}/ci-output/agc-release.json
          AGC_EVENT_NAME: ${{ github.event_name }}
          AGC_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGC_CORE_HAR_VERSION: ${{ steps.ohpm.outputs.core_har_version }}
          AGC_PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AGC_WORKFLOW_SHA: ${{ github.sha }}
        run: .github/scripts/agc-test-release.sh "$AGC_APP_FILE"

      - name: Upload AGC result
        if: ${{ always() && env.AGC_ENABLED == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RustDesk-${{ steps.ohpm.outputs.core_har_version }}-agc-ids
          path: ci-output/agc-release.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ohpm/.ohpmrc"
          rm -rf "$RUNNER_TEMP/rustdesk-signing"
          rm -rf "$GITHUB_WORKSPACE/.ci-signing-repo"
